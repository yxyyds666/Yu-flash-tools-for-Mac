      #     xcrun stapler staple "$DMG"

      - name: Generate release notes
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          {
            echo "notes<<NOTES_EOF"
            echo "## 羽工具箱 v${{ steps.version.outputs.version }}"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### Changes since $PREV_TAG"
              git log --pretty=format:'- %s (%h)' "$PREV_TAG"..HEAD
            else
              echo "### Changes"
              git log --pretty=format:'- %s (%h)' -n 20
            fi
            echo ""
            echo ""
            echo "Built from \`${{ github.sha }}\`."
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: Yutools-${{ steps.version.outputs.version }}-dmg
          path: "Yutools-*.dmg"
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 羽工具箱 v${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: "Yutools-*.dmg"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
